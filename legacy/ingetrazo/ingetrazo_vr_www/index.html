<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>RevitVR</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1014;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { display: block; width: 100%; height: 100%; touch-action: none; }

  .panel { position: fixed; z-index: 10; color: #e8eef6; }

  #topbar { top: 0; left: 0; right: 0; padding: 14px 18px; display: flex; align-items: center;
    gap: 14px; background: linear-gradient(#0d1014cc, #0d101400); pointer-events: none; }
  #topbar > * { pointer-events: auto; }
  #title { font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
    color: #8fa3b8; font-weight: 600; }
  #enter { margin-left: auto; border: 1px solid #3d8fdd; background: #1b6fc4; color: #fff;
    font: inherit; font-size: 14px; font-weight: 600; padding: 10px 20px; border-radius: 8px;
    cursor: pointer; transition: background .15s; }
  #enter:hover:not(:disabled) { background: #2584e0; }
  #enter:disabled { background: #22303f; border-color: #2c3d50; color: #6c8199; cursor: default; }

  #hint { position: fixed; bottom: 18px; left: 18px; font-size: 12px; color: #7d92a8;
    max-width: 460px; line-height: 1.55; }
  #hud { position: fixed; bottom: 18px; right: 18px; font-size: 12px; color: #6d8399;
    font-variant-numeric: tabular-nums; text-align: right; }
  #insecure { display: none; top: 64px; left: 50%; transform: translateX(-50%);
    max-width: 640px; padding: 10px 14px; border-radius: 8px; font-size: 13px;
    line-height: 1.45; background: #3a2a0e; border: 1px solid #7a5a1e; color: #ffd894; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20;
    background: #0d1014; color: #93a7bd; font-size: 14px; letter-spacing: .04em;
    transition: opacity .4s; }
  #loading.gone { opacity: 0; pointer-events: none; }

  #toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(.94);
    padding: 12px 26px; border-radius: 10px; background: #0e1620e0; border: 1px solid #24374b;
    color: #cfe2f5; font-size: 13px; letter-spacing: .12em; opacity: 0;
    transition: opacity .18s, transform .18s; pointer-events: none; z-index: 15; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  body.presenting #topbar, body.presenting #hint, body.presenting #hud { display: none; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="topbar" class="panel">
    <span id="title">RevitVR</span>
    <button id="enter" disabled>Enter VR</button>
  </div>

  <div id="hint" class="panel">
    Loading scene… &nbsp;•&nbsp; Desktop: WASD to move, drag to look, F to fly, R to respawn, C for colliders.
  </div>
  <div id="hud" class="panel"></div>
  <div id="toast"></div>
  <div id="loading">Building the walkable space…</div>
  <div id="insecure" class="panel"></div>

  <!-- IngeTrazo addition: say why Enter VR is unavailable instead of leaving it grey. -->
  <script>
    if (!window.isSecureContext) {
      const el = document.getElementById('insecure');
      const port = location.port ? String(Number(location.port) + 1) : '8771';
      el.style.display = 'block';
      el.textContent = 'Plain http is not a secure origin, so the headset refuses WebXR. '
        + 'Open https://' + location.hostname + ':' + port + '/ and accept the certificate '
        + 'warning once — or connect the headset over USB and use «Export & open on Quest».';
    }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
