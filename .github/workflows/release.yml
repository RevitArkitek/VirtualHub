name: release

# Packages what a hosted runner can build: the standalone server + web app, and the IngeTrazo plugin.
# The Revit add-in package needs Autodesk's assemblies, so it is zipped locally by the maintainer
# (plugins/revit/build.ps1 assembles dist\) and attached to the release by hand.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish server
        run: |
          dotnet publish server/RevitVr.Server/RevitVr.Server.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
            -o dist/server

      - name: Stage packages
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { 'dev' }
          New-Item -ItemType Directory -Force pkg/server, pkg/ingetrazo/plugins/ingetrazo, pkg/ingetrazo/web | Out-Null
          Copy-Item dist/server/* pkg/server/server -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item web/* pkg/server/web -Recurse -Force
          Copy-Item plugins/ingetrazo/* pkg/ingetrazo/plugins/ingetrazo -Recurse -Force
          Copy-Item web/* pkg/ingetrazo/web -Recurse -Force
          Compress-Archive -Path pkg/server/* -DestinationPath "virtualhub-server-$tag.zip" -Force
          Compress-Archive -Path pkg/ingetrazo/* -DestinationPath "virtualhub-ingetrazo-$tag.zip" -Force
          Get-ChildItem *.zip | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: '*.zip'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" *.zip --generate-notes --title "$env:GITHUB_REF_NAME"
