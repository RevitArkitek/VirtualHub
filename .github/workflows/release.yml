name: release

# Packages what a hosted runner can build: the standalone server + web app, and the IngeTrazo plugin.
# The Revit add-in needs Autodesk's assemblies, so its package is built on a machine with Revit and
# attached by hand:
#
#   .\plugins\revit\build.ps1 -NoInstall
#   .\tools\package-release.ps1 -Version v0.1.0 -WithRevit

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the packages'
        default: 'dev'

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the release assets
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { '${{ inputs.version }}' }
          .\tools\package-release.ps1 -Version $version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            release/**/*.zip
            release/**/SHA256SUMS.txt

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(Get-ChildItem "release/$env:VERSION/*.zip") +
                   @(Get-Item "release/$env:VERSION/SHA256SUMS.txt")
          gh release create "$env:VERSION" $files.FullName --generate-notes --title "$env:VERSION"
